name: Apply v1.3 confidence upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/upgrade-v13.mjs
      - .github/workflows/v13-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v1.3 upgrade
        run: node scripts/upgrade-v13.mjs
      - name: Certify upgraded source
        run: npm run certify
      - name: Remove one-shot migration files
        run: rm scripts/upgrade-v13.mjs .github/workflows/v13-upgrade.yml
      - name: Commit certified v1.3 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add evidence confidence and provenance"
          git push origin HEAD:main
